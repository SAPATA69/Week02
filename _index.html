<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML</title>
</head>
<body>
    <h2 style="text-align: center;">แบบสอบถาม</h2>
    <hr> <!-- เส้น -->
    
    <form action="">
        <table align="center" style="background-color: #FFEFD5;" cellpadding="10">
            <tr>
                <td colspan="2">
                    <b>ข้อมูลผู้ตอบแบบสอบถาม</b>
                </td>
            </tr>
            <tr>
                <td><b>ชื่อ-นามสกุล</b></td>
                <td><input type="text" name="fullname" size="30"></td>
            </tr>
            <tr>
                <td><b>วุฒิการศึกษา</b></td>
                <td><input type="text" name="education" size="30"></td>
            </tr>
            <tr>
                <td><b>เพศ</b></td>
                <td>
                    <input type="radio" name="gender" value="male" checked> ชาย
                    <input type="radio" name="gender" value="female"> หญิง
                </td>
            </tr>
            <tr>
                <td><b>สังกัดคณะ</b></td>
                <td>
                    <select name="faculty">
                        <option value="">เลือก</option>
                        <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
                        <option value="วิทยาการคอมพิวเตอร์">วิทยาการคอมพิวเตอร์</option>
                        <option value="ครุศาสตร์">ครุศาสตร์</option>
                        <option value="บริหารกิจและการจัดการ">บริหารกิจและการจัดการ</option>
                        <option value="มนุษยศาสตร์">มนุษยศาสตร์</option>
                        <option value="เทคโนโลยีอุตสาหกรรม">เทคโนโลยีอุตสาหกรรม</option>
                        <option value="เกษตรศาสตร์">เกษตรศาสตร์</option>
                        <option value="พยาบาลศาสตร์">พยาบาลศาสตร์</option>
                        <option value="สาธารณสุขศาสตร์">สาธารณสุขศาสตร์</option>
                        <option value="แพทย์แผนไทยและทางเลือก">แพทย์แผนไทยและทางเลือก</option>
                        <option value="นิติศาสตร์">นิติศาสตร์</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><b>แม่สีที่ชื่นชอบ</b></td>
                <td>
                    <input type="checkbox" name="color" value="blue"> สีแดง
                    <input type="checkbox" name="color" value="yellow"> สีเขียว
                    <input type="checkbox" name="color" value="orange"> สีน้ำเงิน
                </td>
            </tr>
            <tr>
                <td><b>ผลไม้ที่ชื่นชอบ</b></td>
                <td>
                    <input type="checkbox" name="fruit" value="mango"> มะม่วง
                    <input type="checkbox" name="fruit" value="papaya"> น้อยหน่า
                    <input type="checkbox" name="fruit" value="rambutan"> ทุเรียน
                    <input type="checkbox" name="fruit" value="papaya"> ลำไย
                    <input type="checkbox" name="fruit" value="rambutan"> ฝรั่ง
                    <input type="checkbox" name="fruit" value="rambutan"> แตงโม
                </td>
            </tr>
            <tr>
                <td><b>อาหารที่ชื่นชอบ</b></td>
                <td>
                    <input type="checkbox" name="food" value="tomyum"> ต้มยำกุ้ง
                    <input type="checkbox" name="food" value="somtam"> ใขเจียวหมูสับ
                    <input type="checkbox" name="food" value="koy"> แกงขาไก่
                    <input type="checkbox" name="food" value="koy"> แกงเขียวหวานไก่
                    <input type="checkbox" name="food" value="koy"> ผัดไทย
                    <input type="checkbox" name="food" value="koy"> 
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="ยืนยัน">
                </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
